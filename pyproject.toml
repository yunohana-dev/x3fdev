[project]
name = "x3fdev"
version = "0.1.0"
description = "Sigma X3F（Foveon RAW）を好みに合わせて自動現像し、JPEG に書き出すツール"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colour-science>=0.4.7",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.1.0.95",
    "pillow>=13.0.0",
    "tifffile>=2026.11.16",
    "typer>=0.29.3",
]

[project.scripts]
x3fdev = "x3fdev.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x3fdev"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
